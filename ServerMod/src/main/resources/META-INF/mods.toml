modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayTest="IGNORE_SERVER_VERSION"
authors="kenzu926"
description='''
Server-side ComputerCraft API extensions for AE2 monitoring and automatic player-count difficulty control.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},48)"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version},1.21)"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="computercraft"
mandatory=true
versionRange="[${cc_version},2)"
ordering="AFTER"
side="SERVER"

[[dependencies.${mod_id}]]
modId="ae2"
mandatory=true
versionRange="[${ae2_version},16)"
ordering="AFTER"
side="SERVER"
